<script>

        // Variable global para almacenar el nombre del archivo .enc
        let currentEncFileName = null;

        // Función para extraer el nombre del archivo de la URL
        function getEncFileNameFromUrl(url) {
            try {
                const urlObj = new URL(url);
                const pathParts = urlObj.pathname.split('/');
                const fileName = pathParts[pathParts.length - 1];
                // Si no tiene extensión .enc, agregarla como fallback
                return fileName || 'default.enc';
            } catch (e) {
                // Si falla, usar un nombre por defecto basado en la URL
                const match = url.match(/\/([^\/]+\.enc)/);
                return match ? match[1] : 'default.enc';
            }
        }

        // Sistema de control de intentos basado en el nombre del archivo .enc
        function getAttemptCount() {
            if (!currentEncFileName) {
                // Si aún no se ha cargado el nombre, intentar obtenerlo de la URL
                try {
                    const encryptedConfigUrl = atob(ENCRYPTED_CONFIG_URL_B64);
                    currentEncFileName = getEncFileNameFromUrl(encryptedConfigUrl);
                } catch (e) {
                    currentEncFileName = 'default.enc';
                }
            }
            const storageKey = `evaluationAttempts_${currentEncFileName}`;
            const stored = localStorage.getItem(storageKey);
            return stored ? parseInt(stored) : 0;
        }

        function incrementAttemptCount() {
            if (!currentEncFileName) {
                try {
                    const encryptedConfigUrl = atob(ENCRYPTED_CONFIG_URL_B64);
                    currentEncFileName = getEncFileNameFromUrl(encryptedConfigUrl);
                } catch (e) {
                    currentEncFileName = 'default.enc';
                }
            }
            const storageKey = `evaluationAttempts_${currentEncFileName}`;
            attemptCount = getAttemptCount() + 1;
            localStorage.setItem(storageKey, attemptCount.toString());
            return attemptCount;
        }

        function getCurrentAttemptNumber() {
            return getAttemptCount() + 1; // El próximo intento
        }

        // ====================================

        // ====================================

        // URL del archivo cifrado codificada en Base64 para ofuscación

        const ENCRYPTED_CONFIG_URL_B64 = "aHR0cHM6Ly9pbnZqZXN1cy5naXRodWIuaW8vZXZhX1VUVGVjLzAxL2FkbURCMDEuZW5j";

        // Variable global para almacenar la configuración cargada

        // ====================================
        // SISTEMA DE CARGA Y VALIDACIÓN JSON
        // ====================================

        async function loadJSONConfig(secretKey) {
            console.group('📡 CARGANDO CONFIGURACIÓN CIFRADA');
            
            if (!secretKey || secretKey.trim().length === 0) {
                throw new Error('Clave incorrecta. Se requiere una clave para descifrar el archivo.');
            }
            
            // Decodificar URL desde Base64
            const encryptedConfigUrl = atob(ENCRYPTED_CONFIG_URL_B64);
            console.log('🌐 URL del archivo cifrado:', encryptedConfigUrl);
            
            // Extraer y almacenar el nombre del archivo para el sistema de intentos
            currentEncFileName = getEncFileNameFromUrl(encryptedConfigUrl);
            console.log('📁 Nombre del archivo .enc:', currentEncFileName);

            // Configuración optimizada para GitHub Pages
            const fetchOptions = {
                method: 'GET',
                headers: {
                    'Accept': 'application/json, application/octet-stream, text/plain, */*',
                    'User-Agent': 'EvaluacionDigital/1.0'
                },
                mode: 'cors',
                cache: 'no-store'
            };

            try {
                console.log('⏳ Descargando archivo cifrado (.enc)...');

                const urlWithTimestamp = `${encryptedConfigUrl}?_t=${Date.now()}&_r=${Math.random()}`;
                console.log('📡 URL con cache-busting:', urlWithTimestamp);

                const response = await fetch(urlWithTimestamp, fetchOptions);

                console.log('📊 Status HTTP:', response.status, response.statusText);

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('El archivo cifrado no existe. Verifica que el archivo .enc esté subido al servidor.');
                    } else if (response.status === 403) {
                        throw new Error('Acceso denegado (403). Verifica que el repositorio sea público.');
                    } else {
                        throw new Error(`Error HTTP ${response.status}: ${response.statusText}`);
                    }
                }

                console.log('✅ Respuesta HTTP exitosa');

                // Obtener el contenido cifrado como texto
                const encryptedContent = await response.text();
                console.log('📝 Contenido cifrado descargado:', encryptedContent.length, 'caracteres');

                // Verificar si es HTML en lugar del archivo cifrado
                if (encryptedContent.trim().startsWith('<!DOCTYPE') || encryptedContent.trim().startsWith('<html')) {
                    throw new Error('El servidor devolvió HTML en lugar del archivo cifrado. Verifica la URL.');
                }

                // Verificar si es una página de error 404 de GitHub
                if (encryptedContent.includes('404: Not Found') || encryptedContent.includes('File not found')) {
                    throw new Error('El archivo cifrado no existe en la URL especificada.');
                }

                // Limpiar el contenido cifrado (eliminar espacios en blanco)
                const cleanEncryptedContent = encryptedContent.trim();

                // Intentar descifrar el contenido con AES
                console.log('🔐 Intentando descifrar con AES...');
                console.log('🔑 Usando clave secreta proporcionada');
                
                let decryptedContent;
                try {
                    // CryptoJS.AES.decrypt espera el contenido cifrado y la clave
                    // El contenido debe estar en formato Base64 (que es el formato por defecto de CryptoJS)
                    const decrypted = CryptoJS.AES.decrypt(cleanEncryptedContent, secretKey);
                    decryptedContent = decrypted.toString(CryptoJS.enc.Utf8);
                    
                    // Verificar si el descifrado fue exitoso
                    if (!decryptedContent || decryptedContent.length === 0) {
                        console.error('❌ El descifrado resultó en una cadena vacía');
                        console.log('🔍 Esto generalmente indica que la clave es incorrecta');
                        throw new Error('Clave incorrecta. No se pudo descifrar el archivo.');
                    }
                    
                    console.log('✅ Contenido descifrado exitosamente');
                    console.log('📝 Contenido descifrado:', decryptedContent.length, 'caracteres');
                    console.log('🔍 Primeros 50 caracteres del contenido descifrado:', decryptedContent.substring(0, 50));
                    
                    // Procesar el contenido descifrado
                    return await processDecryptedContent(decryptedContent, 'encrypted');
                    
                } catch (decryptError) {
                    console.error('❌ Error descifrando contenido:', decryptError.message);
                    console.log('🔍 Detalles del error:', decryptError);
                    
                    // Si el error ya tiene un mensaje específico, lanzarlo
                    if (decryptError.message.includes('Clave incorrecta')) {
                        throw decryptError;
                    }
                    
                    // Si el descifrado resultó en cadena vacía, es clave incorrecta
                    throw new Error('Clave incorrecta. No se pudo descifrar el archivo.');
                }

            } catch (error) {
                console.error('❌ ERROR CRÍTICO cargando configuración:', error.message);
                console.log('🔧 Detalles técnicos:', error);
                console.log('🌐 URL que falló:', encryptedConfigUrl);
                
                // Diagnóstico específico del error
                console.group('🔍 DIAGNÓSTICO DEL ERROR:');

                if (error.message.includes('fetch') || error.message.includes('Failed to fetch')) {
                    console.log('🌐 Problema de red o CORS detectado');
                    console.log('💡 Posibles causas:');
                    console.log('   - Sin conexión a internet');
                    console.log('   - Repositorio privado (debe ser público)');
                    console.log('   - URL incorrecta');
                } else if (error.message.includes('404') || error.message.includes('no existe')) {
                    console.log('📁 Archivo cifrado no encontrado');
                    console.log('💡 Verifica:');
                    console.log('   - Que el archivo .enc existe en el repositorio');
                    console.log('   - Que la ruta en la URL sea correcta');
                    console.log('   - Que el repositorio sea público');
                    console.log('   - Que hayas cifrado el JSON usando la herramienta cifrar_json.html');
                } else if (error.message.includes('HTML')) {
                    console.log('🌐 GitHub devolvió HTML en lugar del archivo cifrado');
                    console.log('💡 Posibles causas:');
                    console.log('   - URL apunta a la página del repositorio, no al archivo');
                    console.log('   - Archivo no existe y GitHub muestra página 404');
                } else if (error.message.includes('Clave incorrecta')) {
                    console.log('🔐 Error de autenticación');
                    console.log('💡 La clave ingresada no es correcta para descifrar el archivo');
                    console.log('💡 Asegúrate de usar la misma clave con la que cifraste el archivo');
                }

                console.groupEnd();
                console.groupEnd();

                throw error; // Re-lanzar el error para que se maneje en authenticateUser
            }
        }

        // Función auxiliar para procesar contenido descifrado
        async function processDecryptedContent(content, source) {
            // Limpiar el contenido
            let cleanContent = content.trim();

            // Remover BOM si existe
            if (cleanContent.charCodeAt(0) === 0xFEFF) {
                cleanContent = cleanContent.substring(1);
                console.log('🧹 BOM removido del contenido');
            }

            // Verificar que comience con { o [
            if (!cleanContent.startsWith('{') && !cleanContent.startsWith('[')) {
                console.error('❌ El contenido no parece ser JSON válido');
                console.log('🔍 Primeros 100 caracteres después de limpieza:', cleanContent.substring(0, 100));
                throw new Error('El contenido no es JSON válido. Debe comenzar con { o [');
            }

            // Intentar parsear el JSON
            let parsedConfig;
            try {
                parsedConfig = JSON.parse(cleanContent);
                console.log('✅ JSON parseado exitosamente');
                console.log('📋 Claves principales detectadas:', Object.keys(parsedConfig));
            } catch (parseError) {
                console.error('❌ Error parseando JSON:', parseError.message);
                console.log('📄 Contenido que causó el error:', cleanContent.substring(0, 300));

                // Intentar identificar el problema específico
                const errorLine = parseError.message.match(/line (\d+)/);
                if (errorLine) {
                    const lines = cleanContent.split('\n');
                    const lineNum = parseInt(errorLine[1]) - 1;
                    console.log(`🔍 Línea ${lineNum + 1} problemática:`, lines[lineNum]);
                }

                throw new Error(`Error de sintaxis JSON: ${parseError.message}`);
            }

            // Validar la estructura del JSON
            console.log('🔍 Validando estructura del JSON...');
            const validation = validateJSONStructure(parsedConfig);

            if (!validation.isValid) {
                console.error('❌ Estructura JSON inválida');
                console.group('🚨 ERRORES ENCONTRADOS:');
                validation.errors.forEach(error => console.error('  •', error));
                console.groupEnd();

                console.log('📋 Estructura recibida:', JSON.stringify(parsedConfig, null, 2));
                throw new Error('La estructura del JSON no cumple con el formato esperado. Revisa los errores en la consola.');
            }

            console.log('✅ Estructura JSON válida');

            if (validation.warnings.length > 0) {
                console.group('⚠️ ADVERTENCIAS:');
                validation.warnings.forEach(warning => console.warn('  •', warning));
                console.groupEnd();
            }

            // Asignar configuración global
            EVALUATION_CONFIG = parsedConfig;

            console.log('🎉 ¡CONFIGURACIÓN CARGADA EXITOSAMENTE!');
            console.log('📊 Estadísticas finales:', validation.stats);
            console.log('📦 Fuente: Archivo cifrado (.enc)');
            console.groupEnd();

            return {
                success: true,
                config: parsedConfig,
                validation,
                source: 'encrypted-file'
            };
        }

        function validateJSONStructure(config) {
            const errors = [];
            const warnings = [];

            try {
                // Validar que sea un objeto
                if (!config || typeof config !== 'object') {
                    errors.push('El JSON debe ser un objeto válido');
                    return { isValid: false, errors, warnings };
                }

                // Validar sección general
                if (!config.general) {
                    errors.push('Falta la sección "general"');
                } else {
                    if (!config.general.title || typeof config.general.title !== 'string') {
                        errors.push('general.title debe ser un string no vacío');
                    }
                    if (!config.general.subtitle || typeof config.general.subtitle !== 'string') {
                        errors.push('general.subtitle debe ser un string no vacío');
                    }
                    if (!config.general.professor || typeof config.general.professor !== 'string') {
                        errors.push('general.professor debe ser un string no vacío');
                    }
                }

                // Validar section1
                if (!config.section1) {
                    errors.push('Falta la sección "section1"');
                } else {
                    if (typeof config.section1.weight !== 'number' || config.section1.weight <= 0) {
                        errors.push('section1.weight debe ser un número mayor a 0');
                    }
                    if (!Array.isArray(config.section1.questions)) {
                        errors.push('section1.questions debe ser un array');
                    } else {
                        if (config.section1.questions.length === 0) {
                            errors.push('section1.questions no puede estar vacío');
                        }

                        config.section1.questions.forEach((q, index) => {
                            const prefix = `section1.questions[${index}]`;
                            if (!q.question || typeof q.question !== 'string') {
                                errors.push(`${prefix}.question debe ser un string no vacío`);
                            }
                            if (!Array.isArray(q.options)) {
                                errors.push(`${prefix}.options debe ser un array`);
                            } else {
                                if (q.options.length < 2) {
                                    errors.push(`${prefix}.options debe tener al menos 2 opciones`);
                                }
                                q.options.forEach((option, optIndex) => {
                                    if (!option || typeof option !== 'string') {
                                        errors.push(`${prefix}.options[${optIndex}] debe ser un string no vacío`);
                                    }
                                });
                            }
                            if (typeof q.correct !== 'number' || q.correct < 0 || (q.options && q.correct >= q.options.length)) {
                                errors.push(`${prefix}.correct debe ser un índice válido de las opciones`);
                            }
                            if (!q.explanation || typeof q.explanation !== 'string') {
                                warnings.push(`${prefix}.explanation debería ser un string no vacío`);
                            }
                        });
                    }
                }

                // Validar section2
                if (!config.section2) {
                    errors.push('Falta la sección "section2"');
                } else {
                    if (typeof config.section2.weight !== 'number' || config.section2.weight <= 0) {
                        errors.push('section2.weight debe ser un número mayor a 0');
                    }
                    if (!config.section2.pairs || typeof config.section2.pairs !== 'object') {
                        errors.push('section2.pairs debe ser un objeto');
                    } else {
                        const pairsEntries = Object.entries(config.section2.pairs);
                        if (pairsEntries.length === 0) {
                            errors.push('section2.pairs no puede estar vacío');
                        }

                        pairsEntries.forEach(([concept, definition], index) => {
                            if (!concept || typeof concept !== 'string') {
                                errors.push(`section2.pairs: el concepto en posición ${index} debe ser un string no vacío`);
                            }
                            if (!definition || typeof definition !== 'string') {
                                errors.push(`section2.pairs: la definición para "${concept}" debe ser un string no vacío`);
                            }
                        });
                    }
                }

                // Validar section3
                if (!config.section3) {
                    errors.push('Falta la sección "section3"');
                } else {
                    if (typeof config.section3.weight !== 'number' || config.section3.weight <= 0) {
                        errors.push('section3.weight debe ser un número mayor a 0');
                    }
                    if (!Array.isArray(config.section3.words)) {
                        errors.push('section3.words debe ser un array');
                    } else {
                        if (config.section3.words.length === 0) {
                            errors.push('section3.words no puede estar vacío');
                        }

                        config.section3.words.forEach((wordObj, index) => {
                            const prefix = `section3.words[${index}]`;
                            if (!wordObj.word || typeof wordObj.word !== 'string') {
                                errors.push(`${prefix}.word debe ser un string no vacío`);
                            } else {
                                if (!/^[A-Z\s]+$/.test(wordObj.word)) {
                                    warnings.push(`${prefix}.word debería contener solo letras mayúsculas y espacios`);
                                }
                            }
                            if (!wordObj.hint || typeof wordObj.hint !== 'string') {
                                errors.push(`${prefix}.hint debe ser un string no vacío`);
                            }
                        });
                    }
                }

                // Validar que las ponderaciones sumen 100%
                const totalWeight = (config.section1?.weight || 0) +
                    (config.section2?.weight || 0) +
                    (config.section3?.weight || 0);

                if (Math.abs(totalWeight - 100) > 0.01) {
                    errors.push(`Las ponderaciones deben sumar 100%. Suma actual: ${totalWeight}%`);
                }

                return {
                    isValid: errors.length === 0,
                    errors,
                    warnings,
                    stats: {
                        totalQuestions: config.section1?.questions?.length || 0,
                        totalPairs: Object.keys(config.section2?.pairs || {}).length,
                        totalWords: config.section3?.words?.length || 0,
                        totalWeight
                    }
                };

            } catch (error) {
                errors.push(`Error crítico validando estructura: ${error.message}`);
                return { isValid: false, errors, warnings };
            }
        }

        function validateEvaluationConfig() {

            if (!EVALUATION_CONFIG) {
                return {
                    isValid: false,
                    errors: ['No se ha cargado ninguna configuración JSON'],
                    warnings: [],
                    stats: { totalQuestions: 0, totalPairs: 0, totalWords: 0, totalWeight: 0 }

            // Usar la función de validación de estructura existente
            return validateJSONStructure(EVALUATION_CONFIG);

                const errorDiv = document.getElementById('authError');
                errorDiv.innerHTML = `

                return;
            }

            // Mostrar mensaje de carga
            const errorDiv = document.getElementById('authError');
            errorDiv.innerHTML = `

                    <svg class="w-5 h-5 mr-2 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            errorDiv.classList.remove('hidden');

            try {
                // Intentar cargar y descifrar configuración con la clave ingresada
                const loadResult = await loadJSONConfig(secretKey);

                if (!loadResult.success) {
                    console.error('❌ Error cargando configuración');
                    throw new Error(loadResult.error || 'Error desconocido al cargar la configuración');

                console.log('❌ Error en autenticación:', error.message);

                const isWrongKey = error.message.includes('Clave incorrecta') ||

                document.getElementById('accessKeyPassword').classList.add('shake', 'border-red-400');

                setTimeout(() => {

        // Funciones del cronómetro
        function startTimer() {
            startTime = new Date();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            const now = new Date();
            const elapsed = Math.floor((now - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timeDisplay').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const elapsed = Math.floor((new Date() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function initializePointsSystem() {
            // Calcular puntos máximos por sección basado en ponderaciones
            pointsSystem.maxPoints.section1 = EVALUATION_CONFIG.section1.weight;
            pointsSystem.maxPoints.section2 = EVALUATION_CONFIG.section2.weight;
            pointsSystem.maxPoints.section3 = EVALUATION_CONFIG.section3.weight;
            pointsSystem.maxPoints.total = 100;

            // Resetear puntos actuales
            pointsSystem.section1 = 0;
            pointsSystem.section2 = 0;
            pointsSystem.section3 = 0;
            pointsSystem.total = 0;

            console.log('🎯 Sistema de puntos inicializado:', pointsSystem);
        }

        function showPointsButton() {
            const pointsButton = document.getElementById('pointsButton');
            pointsButton.classList.remove('hidden');
            updatePointsDisplay();
        }

        function hidePointsButton() {

            pointsButton.classList.add('hidden');

            if (pointsModal.classList.contains('hidden')) {
                pointsModal.classList.remove('hidden');
                updatePointsDisplay();

                pointsModal.classList.add('hidden');

        function updatePointsDisplay() {
            // Validar integridad del sistema de puntos antes de actualizar
            const calculatedTotal = pointsSystem.section1 + pointsSystem.section2 + pointsSystem.section3;

            // Corregir discrepancias menores (errores de redondeo)
            if (Math.abs(calculatedTotal - pointsSystem.total) > 0.01) {
                console.warn('⚠️ Discrepancia en puntos detectada durante actualización:', {
                    section1: pointsSystem.section1,
                    section2: pointsSystem.section2,
                    section3: pointsSystem.section3,
                    totalCalculado: calculatedTotal,
                    totalEnSistema: pointsSystem.total,
                    diferencia: Math.abs(calculatedTotal - pointsSystem.total)
                });

                // Corregir usando la suma de secciones como fuente de verdad
                pointsSystem.total = calculatedTotal;
                console.log('✅ Total corregido a:', pointsSystem.total);
            }

            // Actualizar botón de puntos
            const buttonPointsDisplay = document.getElementById('buttonPointsDisplay');
            if (buttonPointsDisplay) {
                buttonPointsDisplay.textContent = pointsSystem.total.toFixed(1);
            }

            // Actualizar modal de puntos
            const totalPointsDisplay = document.getElementById('totalPointsDisplay');
            const pointsProgressBar = document.getElementById('pointsProgressBar');
            const progressPercentage = document.getElementById('progressPercentage');

            if (totalPointsDisplay) {
                totalPointsDisplay.textContent = pointsSystem.total.toFixed(1);
            }

            if (pointsProgressBar && progressPercentage) {
                const progressPercent = (pointsSystem.total / pointsSystem.maxPoints.total) * 100;
                pointsProgressBar.style.width = `${Math.min(progressPercent, 100)}%`; // Limitar a 100%
                progressPercentage.textContent = `${Math.min(Math.round(progressPercent), 100)}%`;
            }

            // Actualizar desglose por secciones en el modal con IDs específicos
            const section1PointsValueEl = document.getElementById('section1PointsValue');
            const section2PointsValueEl = document.getElementById('section2PointsValue');
            const section3PointsValueEl = document.getElementById('section3PointsValue');

            if (section1PointsValueEl) {
                section1PointsValueEl.textContent = pointsSystem.section1.toFixed(1);
            }

            if (section2PointsValueEl) {
                section2PointsValueEl.textContent = pointsSystem.section2.toFixed(1);
            }

            if (section3PointsValueEl) {
                section3PointsValueEl.textContent = pointsSystem.section3.toFixed(1);
            }

            // Log de verificación para debugging
            console.log('📊 Puntos actualizados:', {
                section1: `${pointsSystem.section1.toFixed(1)}/${pointsSystem.maxPoints.section1}`,
                section2: `${pointsSystem.section2.toFixed(1)}/${pointsSystem.maxPoints.section2}`,
                section3: `${pointsSystem.section3.toFixed(1)}/${pointsSystem.maxPoints.section3}`,
                total: `${pointsSystem.total.toFixed(1)}/${pointsSystem.maxPoints.total}`,
                progreso: `${((pointsSystem.total / pointsSystem.maxPoints.total) * 100).toFixed(1)}%`
            });
        }

        function addPointsSection1(questionIndex, isCorrect) {
            const totalQuestions = questionMappings.length;
            const pointsPerQuestion = pointsSystem.maxPoints.section1 / totalQuestions;

            // Calcular puntos exactos para esta pregunta
            const pointsForThisQuestion = isCorrect ? pointsPerQuestion : 0;

            // Agregar puntos de esta pregunta específica
            pointsSystem.section1 += pointsForThisQuestion;

            // Asegurar que no exceda el máximo por errores de redondeo
            pointsSystem.section1 = Math.min(pointsSystem.section1, pointsSystem.maxPoints.section1);

            // Recalcular total de forma precisa
            pointsSystem.total = pointsSystem.section1 + pointsSystem.section2 + pointsSystem.section3;

            // Validar que el total no exceda 100
            pointsSystem.total = Math.min(pointsSystem.total, pointsSystem.maxPoints.total);

            updatePointsDisplay();

            // Mostrar animación de puntos ganados
            if (isCorrect) {
                showPointsAnimation(`+${pointsForThisQuestion.toFixed(1)} pts`, 'success');
            } else {
                showPointsAnimation('0 pts', 'error');
            }

            // Log detallado para debugging
            console.log(`📊 Sección 1 - Pregunta ${questionIndex + 1}:`, {
                esCorrecta: isCorrect,
                puntosEsta: pointsForThisQuestion.toFixed(2),
                puntosSeccion: pointsSystem.section1.toFixed(2),
                maxPuntosSeccion: pointsSystem.maxPoints.section1,
                totalGeneral: pointsSystem.total.toFixed(2),
                progreso: `${questionIndex + 1}/${totalQuestions}`
            });
        }

        function calculateSection2Points() {
            const totalPairs = Object.keys(EVALUATION_CONFIG.section2.pairs).length;
            let correctPairs = 0;

            // Contar pares correctos con validación detallada
            const pairResults = [];
            Object.keys(EVALUATION_CONFIG.section2.pairs).forEach(concept => {
                const correctDefinition = EVALUATION_CONFIG.section2.pairs[concept];
                const userConnection = section2Connections[concept];
                const isCorrect = userConnection && userConnection.definition === correctDefinition;

                if (isCorrect) {
                    correctPairs++;
                }

                pairResults.push({
                    concept: concept,
                    correctDefinition: correctDefinition,
                    userDefinition: userConnection ? userConnection.definition : null,
                    isCorrect: isCorrect
                });
            });

            // Calcular puntos de la sección 2 con precisión
            const section2Score = totalPairs > 0 ? (correctPairs / totalPairs) * pointsSystem.maxPoints.section2 : 0;
            const previousSection2Points = pointsSystem.section2;

            // Actualizar puntos de sección 2
            pointsSystem.section2 = section2Score;

            // Asegurar que no exceda el máximo
            pointsSystem.section2 = Math.min(pointsSystem.section2, pointsSystem.maxPoints.section2);

            // Recalcular total de forma precisa
            pointsSystem.total = pointsSystem.section1 + pointsSystem.section2 + pointsSystem.section3;

            // Validar que el total no exceda 100
            pointsSystem.total = Math.min(pointsSystem.total, pointsSystem.maxPoints.total);

            updatePointsDisplay();

            // Mostrar animación de puntos ganados
            const pointsGained = section2Score - previousSection2Points;
            if (pointsGained > 0) {
                showPointsAnimation(`+${pointsGained.toFixed(1)} pts`, 'success');
            } else if (section2Score > 0) {
                showPointsAnimation(`${section2Score.toFixed(1)} pts total`, 'success');
            } else {
                showPointsAnimation('0 pts', 'error');
            }

            // Log detallado para debugging
            console.log(`📊 Sección 2 - Resultados detallados:`, {
                totalPares: totalPairs,
                paresCorrectos: correctPairs,
                porcentajeAcierto: totalPairs > 0 ? ((correctPairs / totalPairs) * 100).toFixed(1) + '%' : '0%',
                puntosCalculados: section2Score.toFixed(2),
                maxPuntosSeccion: pointsSystem.maxPoints.section2,
                totalGeneral: pointsSystem.total.toFixed(2),
                detalleResultados: pairResults
            });

            return {
                correctPairs,
                totalPairs,
                points: section2Score,
                percentage: totalPairs > 0 ? (correctPairs / totalPairs) * 100 : 0,
                pairResults: pairResults
            };
        }

        // Sistema de puntuación mejorado para la Sección 3
        let section3WordResults = []; // Array para almacenar resultados de cada palabra

        function addPointsSection3(wordIndex, isCompleted, wrongAttempts = 0) {
            const totalWords = shuffledHangmanWords.length;
            const basePointsPerWord = pointsSystem.maxPoints.section3 / totalWords;

            let pointsForThisWord = 0;
            let status = '';
            let efficiency = 0;

            if (isCompleted) {
                // Palabra completada: puntos base menos penalización por errores
                // Penalización: 15% por cada intento fallido (máximo 90% de penalización)
                const penaltyPercentage = Math.min(wrongAttempts * 0.15, 0.90);
                const penalty = basePointsPerWord * penaltyPercentage;
                pointsForThisWord = Math.max(basePointsPerWord * 0.1, basePointsPerWord - penalty); // Mínimo 10% de puntos base
                status = `Completada (${wrongAttempts} errores)`;
                efficiency = pointsForThisWord / basePointsPerWord;
            } else {
                // Palabra fallida (6 errores): 0 puntos
                pointsForThisWord = 0;
                status = 'Fallida';
                efficiency = 0;
            }

            // Guardar resultado de esta palabra con validación
            section3WordResults[wordIndex] = {
                word: shuffledHangmanWords[wordIndex].word,
                hint: shuffledHangmanWords[wordIndex].hint,
                isCompleted: isCompleted,
                wrongAttempts: wrongAttempts,
                points: pointsForThisWord,
                basePoints: basePointsPerWord,
                efficiency: efficiency,
                status: status,
                wordIndex: wordIndex
            };

            // Recalcular puntos totales de la sección 3 con validación
            const calculatedSection3Points = section3WordResults
                .filter(result => result !== undefined)
                .reduce((total, result) => total + result.points, 0);

            // Actualizar puntos de sección 3
            pointsSystem.section3 = calculatedSection3Points;

            // Asegurar que no exceda el máximo por errores de redondeo
            pointsSystem.section3 = Math.min(pointsSystem.section3, pointsSystem.maxPoints.section3);

            // Recalcular total de forma precisa
            pointsSystem.total = pointsSystem.section1 + pointsSystem.section2 + pointsSystem.section3;

            // Validar que el total no exceda 100
            pointsSystem.total = Math.min(pointsSystem.total, pointsSystem.maxPoints.total);

            updatePointsDisplay();

            // Mostrar animación de puntos ganados con información detallada
            if (pointsForThisWord > 0) {
                const efficiencyPercent = (efficiency * 100).toFixed(0);
                showPointsAnimation(`+${pointsForThisWord.toFixed(1)} pts (${efficiencyPercent}%)`, 'success');
            } else {
                showPointsAnimation(`0 pts (${status})`, 'error');
            }

            // Log detallado para debugging
            console.log(`📊 Sección 3 - Palabra ${wordIndex + 1} procesada:`, {
                palabra: shuffledHangmanWords[wordIndex].word,
                estado: status,
                errores: `${wrongAttempts}/6`,
                puntosBase: basePointsPerWord.toFixed(2),
                puntosObtenidos: pointsForThisWord.toFixed(2),
                eficiencia: (efficiency * 100).toFixed(1) + '%',
                totalSeccion3: pointsSystem.section3.toFixed(2),
                maxPuntosSeccion: pointsSystem.maxPoints.section3,
                totalGeneral: pointsSystem.total.toFixed(2),
                progreso: `${wordIndex + 1}/${totalWords}`
            });

            // Validación adicional de integridad
            const expectedTotal = section3WordResults
                .filter(r => r !== undefined)
                .reduce((sum, r) => sum + r.points, 0);

            if (Math.abs(expectedTotal - pointsSystem.section3) > 0.01) {
                console.warn('⚠️ Discrepancia en Sección 3 detectada:', {
                    esperado: expectedTotal,
                    actual: pointsSystem.section3,
                    diferencia: Math.abs(expectedTotal - pointsSystem.section3)
                });
                pointsSystem.section3 = expectedTotal;
                pointsSystem.total = pointsSystem.section1 + pointsSystem.section2 + pointsSystem.section3;
                updatePointsDisplay();
            }

            return {
                points: pointsForThisWord,
                basePoints: basePointsPerWord,
                efficiency: efficiency,
                status: status,
                wordData: section3WordResults[wordIndex]
            };
        }

            setTimeout(() => {
                animation.style.transform = 'translateY(-30px)';
                animation.style.opacity = '0';
            }, 100);

            setTimeout(() => {
                animation.remove();
            }, 1100);
        }

        function shuffleQuestionsAndAnswers() {
            // Crear una copia de las preguntas originales del JSON
            const originalQuestions = [...EVALUATION_CONFIG.section1.questions];

            // Mezclar el orden de las preguntas
            shuffledQuestions = originalQuestions.sort(() => Math.random() - 0.5);

            // Para cada pregunta, mezclar las opciones y mantener el mapeo de la respuesta correcta
            questionMappings = shuffledQuestions.map((question, questionIndex) => {
                const originalOptions = [...question.options];
                const originalCorrect = question.correct;

                // Crear array de índices y mezclarlos
                const optionIndices = [0, 1, 2];
                const shuffledIndices = optionIndices.sort(() => Math.random() - 0.5);

                // Crear las opciones mezcladas
                const shuffledOptions = shuffledIndices.map(index => originalOptions[index]);

                // Encontrar la nueva posición de la respuesta correcta
                const newCorrectIndex = shuffledIndices.indexOf(originalCorrect);

                return {
                    question: question.question,
                    options: shuffledOptions,
                    correct: newCorrectIndex,
                    explanation: question.explanation,
                    originalIndex: EVALUATION_CONFIG.section1.questions.indexOf(question)
                };
            });
        }

        // Funciones de la Sección 2
        function initSection2() {
            // Actualizar contadores dinámicos
            const totalPairs = Object.keys(EVALUATION_CONFIG.section2.pairs).length;
            const section2PairsEl = document.getElementById('section2Pairs');
            const section2WeightEl = document.getElementById('section2Weight');

            if (section2PairsEl) section2PairsEl.textContent = totalPairs;
            if (section2WeightEl) section2WeightEl.textContent = EVALUATION_CONFIG.section2.weight;

            // Crear mapeos con números aleatorios usando algoritmo Fisher-Yates mejorado
            const conceptsArray = Object.keys(EVALUATION_CONFIG.section2.pairs);
            const definitionsArray = Object.values(EVALUATION_CONFIG.section2.pairs);

            // Función de mezcla robusta Fisher-Yates con semilla temporal
            function robustShuffle(array) {
                const shuffled = [...array];
                const seed = Date.now() + Math.random() * 1000000;

                for (let i = shuffled.length - 1; i > 0; i--) {
                    // Usar múltiples fuentes de aleatoriedad
                    const randomSource1 = Math.sin(seed * (i + 1)) * 10000;
                    const randomSource2 = Math.cos(Date.now() * (i + 1)) * 10000;
                    const randomSource3 = Math.random();

                    const combinedRandom = (randomSource1 + randomSource2 + randomSource3) % 1;
                    const j = Math.floor(Math.abs(combinedRandom) * (i + 1));

                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }

                return shuffled;
            }

            // Mezclar conceptos y definiciones por separado con algoritmo robusto
            const shuffledConcepts = robustShuffle(conceptsArray);
            const shuffledDefinitions = robustShuffle(definitionsArray);

            // Aplicar mezcla adicional para evitar patrones
            const additionalShuffleConcepts = robustShuffle(shuffledConcepts);
            const additionalShuffleDefinitions = robustShuffle(shuffledDefinitions);

            // Crear mapeos con números del 1 al total de pares
            section2Mappings = additionalShuffleConcepts.map((concept, index) => ({
                concept: concept,
                correctDefinition: EVALUATION_CONFIG.section2.pairs[concept],
                conceptNumber: index + 1,
                conceptIndex: index
            }));

            // Crear mapeo de definiciones con números
            const definitionMappings = additionalShuffleDefinitions.map((definition, index) => ({
                definition: definition,
                definitionNumber: index + 1,
                definitionIndex: index
            }));

            const conceptsContainer = document.getElementById('conceptsColumn');
            const definitionsContainer = document.getElementById('definitionsColumn');

            // Renderizar conceptos con números
            conceptsContainer.innerHTML = section2Mappings.map((mapping) => `

                    <div class="flex items-start">
                        <div class="flex-shrink-0 w-8 h-8 bg-indigo-700 text-white rounded-full flex items-center justify-center font-bold text-sm mr-3">
                            ${mapping.conceptNumber}

            `).join('');

            // Renderizar definiciones con números
            definitionsContainer.innerHTML = definitionMappings.map((mapping) => `
                <div class="definition-item bg-teal-50 border border-teal-300 rounded-lg p-3 md:p-4 cursor-pointer hover:bg-teal-100 transition-colors duration-200 text-sm md:text-base" 
                     data-definition="${mapping.definition}" 
                     data-definition-number="${mapping.definitionNumber}"
                     data-index="${mapping.definitionIndex}">
                    <div class="flex items-start">
                        <div class="flex-shrink-0 w-8 h-8 bg-teal-700 text-white rounded-full flex items-center justify-center font-bold text-sm mr-3">
                            ${mapping.definitionNumber}
                        </div>
                        <div class="flex-1">
                            ${mapping.definition}
                        </div>
                    </div>

            // Agregar event listeners mejorados
            selectedConceptNumber = null;

            document.querySelectorAll('.concept-item').forEach(item => {
                item.addEventListener('click', () => {

                    document.querySelectorAll('.concept-item').forEach(c => {
                        c.classList.remove('ring-4', 'ring-indigo-500', 'bg-indigo-200');
                    });

                    // Agregar selección actual
                    item.classList.add('ring-4', 'ring-indigo-500', 'bg-indigo-200');
                    selectedConceptNumber = item.dataset.conceptNumber;

                    // Mostrar indicador visual de selección

        function validateDuplicateConnections() {
            const connections = Object.values(section2Connections);
            const conceptNumbers = connections.map(conn => conn.conceptNumber);
            const definitionNumbers = connections.map(conn => conn.definitionNumber);

            // Buscar números duplicados en conceptos
            const duplicateConceptNumbers = conceptNumbers.filter((num, index) =>
                conceptNumbers.indexOf(num) !== index
            );

            // Buscar números duplicados en definiciones
            const duplicateDefinitionNumbers = definitionNumbers.filter((num, index) =>
                definitionNumbers.indexOf(num) !== index
            );

            const duplicates = {
                concepts: [...new Set(duplicateConceptNumbers)],
                definitions: [...new Set(duplicateDefinitionNumbers)]
            };

            return {
                hasDuplicates: duplicates.concepts.length > 0 || duplicates.definitions.length > 0,
                duplicates: duplicates
            };
        }

        function highlightDuplicates(duplicates) {
            // Limpiar resaltados previos
            document.querySelectorAll('.duplicate-highlight').forEach(el => {
                el.classList.remove('duplicate-highlight', 'ring-4', 'ring-red-500', 'bg-red-100');
            });

            // Resaltar conceptos duplicados
            duplicates.concepts.forEach(conceptNum => {
                Object.keys(section2Connections).forEach(concept => {
                    if (section2Connections[concept].conceptNumber == conceptNum) {
                        const conceptElement = document.querySelector(`[data-concept="${concept}"]`);
                        if (conceptElement) {
                            conceptElement.classList.add('duplicate-highlight', 'ring-4', 'ring-red-500', 'bg-red-100');
                        }
                    }
                });
            });

            // Resaltar definiciones duplicadas
            duplicates.definitions.forEach(defNum => {
                Object.values(section2Connections).forEach(connection => {
                    if (connection.definitionNumber == defNum) {
                        const definitionElement = document.querySelector(`[data-definition="${connection.definition}"]`);
                        if (definitionElement) {
                            definitionElement.classList.add('duplicate-highlight', 'ring-4', 'ring-red-500', 'bg-red-100');
                        }
                    }
                });
            });

            // Cerrar modal
            closeDuplicateWarning();

            // Mostrar notificación
            showNotification('Elementos duplicados resaltados en rojo', 'warning');

            // Quitar resaltado después de 10 segundos
            setTimeout(() => {
                document.querySelectorAll('.duplicate-highlight').forEach(el => {
                    el.classList.remove('duplicate-highlight', 'ring-4', 'ring-red-500', 'bg-red-100');
                });
            }, 10000);
        }

        function closeDuplicateWarning() {
            if (window.currentDuplicateModal) {
                window.currentDuplicateModal.remove();
                window.currentDuplicateModal = null;
            }
        }

        // Funciones de la Sección 3
        function shuffleHangmanWords() {
            // Crear una copia de las palabras originales del JSON y mezclarlas
            shuffledHangmanWords = [...EVALUATION_CONFIG.section3.words].sort(() => Math.random() - 0.5);
            console.log('🔀 Palabras del ahorcado mezcladas:', shuffledHangmanWords.map(w => w.word));
        }

        function initSection3() {
            // Actualizar contadores dinámicos
            const totalWords = EVALUATION_CONFIG.section3.words.length;
            const totalWordsEl = document.getElementById('totalWords');
            const section3WeightEl = document.getElementById('section3Weight');

            if (totalWordsEl) totalWordsEl.textContent = totalWords;
            if (section3WeightEl) section3WeightEl.textContent = EVALUATION_CONFIG.section3.weight;

            // Mezclar las palabras antes de comenzar
            shuffleHangmanWords();

            section3Data.currentWordIndex = 0;
            section3Data.wordsCompleted = 0;
            section3Data.totalAttempts = 0;
            loadHangmanWord();
        }

        function loadHangmanWord() {
            const wordData = shuffledHangmanWords[section3Data.currentWordIndex];
            const word = wordData.word;

            document.getElementById('currentWord').textContent = section3Data.currentWordIndex + 1;
            document.getElementById('wordHint').textContent = wordData.hint;
            document.getElementById('wrongAttempts').textContent = '0';
            document.getElementById('hangmanDrawing').textContent = '';

            // Mostrar palabra con guiones (limpiar clases de color previas)
            const wordDisplay = document.getElementById('wordDisplay');
            wordDisplay.innerHTML = word.split('').map(letter =>
                letter === ' ' ? '&nbsp;&nbsp;' : '_'
            ).join(' ');
            wordDisplay.classList.remove('text-green-600', 'text-red-600', 'font-bold');

            // Crear botones de letras
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            document.getElementById('letterButtons').innerHTML = alphabet.split('').map(letter => `
                <button class="hangman-letter bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-2 md:px-3 rounded transition-colors duration-200 text-sm md:text-base" 
                        onclick="guessLetter('${letter}')" data-letter="${letter}">
                    ${letter}
                </button>
            `).join('');

            // Resetear variables del juego
            window.currentHangmanWord = word;
            window.guessedLetters = [];
            window.wrongGuesses = 0;

            document.getElementById('nextWordBtn').classList.add('hidden');

            // Mostrar información de puntuación para esta palabra
            const totalWords = shuffledHangmanWords.length;
            const basePointsPerWord = pointsSystem.maxPoints.section3 / totalWords;

        function guessLetter(letter) {
            if (window.guessedLetters.includes(letter)) return;

            window.guessedLetters.push(letter);
            const button = document.querySelector(`[data-letter="${letter}"]`);

            if (window.currentHangmanWord.includes(letter)) {
                button.classList.remove('bg-gray-200', 'hover:bg-gray-300');
                button.classList.add('bg-green-500', 'text-white');
                updateWordDisplay();
            } else {
                button.classList.remove('bg-gray-200', 'hover:bg-gray-300');
                button.classList.add('bg-red-500', 'text-white');
                window.wrongGuesses++;
                section3Data.totalAttempts++;
                document.getElementById('wrongAttempts').textContent = window.wrongGuesses;
                updateHangmanDrawing();
            }

            button.disabled = true;
            button.classList.add('cursor-not-allowed');

            checkHangmanWin();
        }

        function updateWordDisplay() {
            const word = window.currentHangmanWord;
            const display = word.split('').map(letter => {
                if (letter === ' ') return '&nbsp;&nbsp;';
                return window.guessedLetters.includes(letter) ? letter : '_';
            }).join(' ');

            document.getElementById('wordDisplay').innerHTML = display;
        }

        function updateHangmanDrawing() {
            const drawings = ['😟', '😰', '😨', '😱', '💀', '☠️'];
            if (window.wrongGuesses <= drawings.length) {
                document.getElementById('hangmanDrawing').textContent = drawings[window.wrongGuesses - 1] || '';
            }
        }

        function checkHangmanWin() {
            const word = window.currentHangmanWord;
            const isComplete = word.split('').every(letter =>
                letter === ' ' || window.guessedLetters.includes(letter)
            );

            if (isComplete) {
                section3Data.wordsCompleted++;

                // Agregar puntos por palabra completada
                const result = addPointsSection3(section3Data.currentWordIndex, true, window.wrongGuesses);

                // Mostrar mensaje de éxito con detalles de puntuación
                const efficiency = (result.efficiency * 100).toFixed(0);
                const message = window.wrongGuesses === 0 ?
                    '¡Perfecto! Palabra completada sin errores.' :
                    `¡Bien! Palabra completada con ${window.wrongGuesses} error${window.wrongGuesses > 1 ? 'es' : ''}.`;

                showNotification(`${message} Eficiencia: ${efficiency}%`, 'success');

                // Resaltar la palabra completada en verde
                document.getElementById('wordDisplay').classList.add('text-green-600', 'font-bold');

                document.getElementById('nextWordBtn').classList.remove('hidden');

                // Deshabilitar todos los botones de letras
                document.querySelectorAll('.hangman-letter').forEach(btn => {
                    btn.disabled = true;
                    btn.classList.add('cursor-not-allowed');
                });

            } else if (window.wrongGuesses >= 6) {
                // Agregar puntos por palabra fallida (0 puntos)
                addPointsSection3(section3Data.currentWordIndex, false, window.wrongGuesses);

                document.getElementById('nextWordBtn').classList.remove('hidden');

                // Mostrar la palabra completa en rojo
                document.getElementById('wordDisplay').innerHTML = word.split('').join(' ');
                document.getElementById('wordDisplay').classList.add('text-red-600', 'font-bold');

                // Deshabilitar todos los botones de letras
                document.querySelectorAll('.hangman-letter').forEach(btn => {
                    btn.disabled = true;
                    btn.classList.add('cursor-not-allowed');
                });

                showNotification('Palabra fallida. La respuesta correcta se muestra arriba.', 'error');
            }
        }

        // Función para generar hash de seguridad
        function generateSecurityHash(data) {
            // Función simple de hash para crear un identificador único
            let hash = 0;
            const str = JSON.stringify(data);
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convertir a 32-bit integer
            }
            return Math.abs(hash).toString(16).toUpperCase();
        }

        // Función para generar código QR
        function generateQRCode(evaluationData) {
            const qrContainer = document.getElementById('qrcode');

            try {
                // Crear datos estructurados para el QR
                const qrData = {
                    estudiante: evaluationData.name,
                    grupo: evaluationData.group,
                    fecha: evaluationData.date,
                    hora: evaluationData.time,
                    tiempo_total: evaluationData.totalTime,
                    seccion1: `${evaluationData.section1Score}%`,
                    seccion2: `${evaluationData.section2Score}%`,
                    seccion3: `${evaluationData.section3Score}%`,
                    calificacion_final: `${evaluationData.finalScore}%`,
                    intento: evaluationData.attempt,
                    profesor: EVALUATION_CONFIG.general.professor,
                    materia: EVALUATION_CONFIG.general.subtitle,
                    hash: generateSecurityHash(evaluationData)
                };

                // Convertir a texto compacto para el QR
                const qrText = JSON.stringify(qrData);

                // Limpiar contenedor
                qrContainer.innerHTML = '';

                // Crear canvas para el QR
                const canvas = document.createElement('canvas');
                qrContainer.appendChild(canvas);

                // Generar QR usando QRious
                const qr = new QRious({
                    element: canvas,
                    value: qrText,
                    size: 200,
                    background: '#ffffff',
                    foreground: '#1e40af',
                    level: 'M'
                });

                console.log('QR generado exitosamente con QRious');

                // Almacenar datos para descarga
                window.currentQRData = qrData;
                window.currentQRCanvas = canvas;

            } catch (error) {
                console.error('Error generando QR:', error);

                // Fallback: generar QR usando API externa
                generateQRCodeFallback(evaluationData);
            }
        }

        // Función de respaldo para generar QR usando API externa
        function generateQRCodeFallback(evaluationData) {
            const qrContainer = document.getElementById('qrcode');

            try {
                // Crear datos más compactos para la API
                const qrData = {
                    est: evaluationData.name,
                    grp: evaluationData.group,
                    fec: evaluationData.date,
                    hor: evaluationData.time,
                    tmp: evaluationData.totalTime,
                    s1: evaluationData.section1Score,
                    s2: evaluationData.section2Score,
                    s3: evaluationData.section3Score,
                    fin: evaluationData.finalScore,
                    int: evaluationData.attempt,
                    prof: EVALUATION_CONFIG.general.professor,
                    hash: generateSecurityHash(evaluationData).substring(0, 8)
                };

                const qrText = encodeURIComponent(JSON.stringify(qrData));

                // Usar API de QR Server
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${qrText}&color=1e40af&bgcolor=ffffff`;

                qrContainer.innerHTML = `
                    <img src="${qrUrl}" 
                         alt="Código QR de Verificación" 
                         class="w-50 h-50 border border-gray-300 rounded-lg"
                         onload="handleQRImageLoad(this)"
                         onerror="handleQRImageError(this)">
                `;

                // Almacenar datos para descarga
                window.currentQRData = qrData;
                window.currentQRUrl = qrUrl;

            } catch (error) {
                console.error('Error en fallback QR:', error);
                showQRError();
            }
        }

                maxPoints: pointsSystem.maxPoints
            });

            // 2. Recalcular puntos de cada sección para verificar congruencia

            // SECCIÓN 1: Recálculo basado en respuestas
            let recalculatedSection1 = 0;
            if (section1Answers.length > 0) {
                const totalQuestions = questionMappings.length;
                const pointsPerQuestion = pointsSystem.maxPoints.section1 / totalQuestions;
                let correctAnswers = 0;

                section1Answers.forEach((answer, index) => {
                    if (answer === questionMappings[index].correct) {
                        correctAnswers++;
                        recalculatedSection1 += pointsPerQuestion;
                    }
                });

                console.log('📝 Sección 1 - Recálculo:', {
                    totalPreguntas: totalQuestions,
                    respuestasCorrectas: correctAnswers,
                    puntosCalculados: recalculatedSection1,
                    puntosEnSistema: pointsSystem.section1,
                    congruente: Math.abs(recalculatedSection1 - pointsSystem.section1) < 0.01
                });
            }

            // SECCIÓN 2: Recálculo basado en conexiones
            let recalculatedSection2 = 0;
            if (Object.keys(section2Connections).length > 0) {
                const totalPairs = Object.keys(EVALUATION_CONFIG.section2.pairs).length;
                let correctPairs = 0;

                Object.keys(EVALUATION_CONFIG.section2.pairs).forEach(concept => {
                    if (section2Connections[concept] &&
                        section2Connections[concept].definition === EVALUATION_CONFIG.section2.pairs[concept]) {
                        correctPairs++;
                    }
                });

                recalculatedSection2 = (correctPairs / totalPairs) * pointsSystem.maxPoints.section2;

                console.log('🔗 Sección 2 - Recálculo:', {
                    totalPares: totalPairs,
                    paresCorrectos: correctPairs,
                    puntosCalculados: recalculatedSection2,
                    puntosEnSistema: pointsSystem.section2,
                    congruente: Math.abs(recalculatedSection2 - pointsSystem.section2) < 0.01
                });
            }

            // SECCIÓN 3: Recálculo basado en resultados de palabras
            let recalculatedSection3 = 0;
            if (section3WordResults.length > 0) {
                recalculatedSection3 = section3WordResults
                    .filter(result => result !== undefined)
                    .reduce((total, result) => total + result.points, 0);

                console.log('🎯 Sección 3 - Recálculo:', {
                    palabrasCompletadas: section3WordResults.filter(r => r && r.isCompleted).length,
                    palabrasFallidas: section3WordResults.filter(r => r && !r.isCompleted).length,
                    puntosCalculados: recalculatedSection3,
                    puntosEnSistema: pointsSystem.section3,
                    congruente: Math.abs(recalculatedSection3 - pointsSystem.section3) < 0.01,
                    detalleResultados: section3WordResults
                });
            }

            // 3. Verificar congruencia total
            const recalculatedTotal = recalculatedSection1 + recalculatedSection2 + recalculatedSection3;
            const totalCongruent = Math.abs(recalculatedTotal - pointsSystem.total) < 0.01;

            console.log('🎯 VERIFICACIÓN TOTAL:', {
                totalRecalculado: recalculatedTotal,
                totalEnSistema: pointsSystem.total,
                diferencia: Math.abs(recalculatedTotal - pointsSystem.total),
                congruenteTotal: totalCongruent
            });

            // 4. Corregir discrepancias si existen
            if (!totalCongruent) {
                console.warn('⚠️ DISCREPANCIA DETECTADA - Corrigiendo...');

                // Usar valores recalculados como fuente de verdad
                pointsSystem.section1 = recalculatedSection1;
                pointsSystem.section2 = recalculatedSection2;
                pointsSystem.section3 = recalculatedSection3;
                pointsSystem.total = recalculatedTotal;

                console.log('✅ Puntuación corregida:', pointsSystem);

                // Actualizar display de puntos acumulados
                updatePointsDisplay();

            // ====================================

            const section1Percentage = pointsSystem.maxPoints.section1 > 0 ?
                (pointsSystem.section1 / pointsSystem.maxPoints.section1) * 100 : 0;
            const section2Percentage = pointsSystem.maxPoints.section2 > 0 ?
                (pointsSystem.section2 / pointsSystem.maxPoints.section2) * 100 : 0;
            const section3Percentage = pointsSystem.maxPoints.section3 > 0 ?
                (pointsSystem.section3 / pointsSystem.maxPoints.section3) * 100 : 0;

            // La calificación final es directamente el total de puntos (ya está en escala 0-100)

            });

                    pdf.text('Error: No se pudo generar el código QR', 20, yPos + 40);
                }

                yPos += 80; // Más espacio después de la verificación digital

                // ====================================
                // AVISO IMPORTANTE
                // ====================================

                // Marco amarillo para aviso
                pdf.setFillColor(255, 255, 200); // Amarillo claro
                pdf.setDrawColor(255, 255, 0); // Amarillo
                pdf.setLineWidth(1);
                pdf.rect(15, yPos, 180, 35, 'FD'); // Aumentar altura del aviso

                // Título del aviso centrado
                pdf.setTextColor(0, 0, 0);
                pdf.setFontSize(11);
                pdf.text('AVISO IMPORTANTE', 105, yPos + 8, { align: 'center' });

                // Texto del aviso con mejor espaciado
                pdf.setFontSize(9);
                pdf.text('Este documento carece de validez oficial; su propósito es únicamente', 20, yPos + 18);
                pdf.text('informativo y permite al estudiante conocer resultados preliminares', 20, yPos + 24);
                pdf.text('antes de los oficiales.', 20, yPos + 30);

                yPos += 45; // Más espacio después del aviso

                // ====================================
                // FIRMA DEL PROFESOR
                // ====================================

                // Línea para firma
                pdf.setDrawColor(0, 0, 0);
                pdf.setLineWidth(0.5);
                pdf.line(120, yPos, 190, yPos);

                // Firma alineada a la derecha
                pdf.setTextColor(0, 0, 0);
                pdf.setFontSize(10);
                pdf.text(document.getElementById('professorName').textContent, 150, yPos + 8);
                pdf.setFontSize(8);
                pdf.text('Profesor de Asignatura', 150, yPos + 13);

                // Agregar espacio final para evitar que quede muy cerca del borde
                yPos += 20;

                // Descargar el PDF
                const fileName = `Reporte_Evaluacion_${studentData.name.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.pdf`;
                pdf.save(fileName);

                showNotification('Reporte PDF descargado exitosamente', 'success');

            } catch (error) {
                console.error('Error generando PDF:', error);
                showNotification('Error al generar el PDF. Intenta nuevamente.', 'error');
            }
        }


        // Función para reiniciar la evaluación
        function resetEvaluation() {
            // Resetear todas las variables globales
            currentQuestionIndex = 0;
            section1Answers = [];
            section2Connections = {};
            section2Mappings = [];
            selectedConceptNumber = null;
            section3Data = {
                currentWordIndex: 0,
                wordsCompleted: 0,
                totalAttempts: 0
            };
            isProcessingAnswer = false;
            shuffledQuestions = [];
            questionMappings = [];
            shuffledHangmanWords = [];
            section3WordResults = []; // Resetear resultados de palabras de la sección 3

            // Resetear sistema de puntos
            pointsSystem = {
                section1: 0,
                section2: 0,
                section3: 0,
                total: 0,
                maxPoints: {
                    section1: 0,
                    section2: 0,
                    section3: 0,
                    total: 100
                }
            };

            // Ocultar botón de puntos
            hidePointsButton();

            // Cerrar modal de puntos si está abierto
            const pointsModal = document.getElementById('pointsModal');
            if (pointsModal) {
                pointsModal.classList.add('hidden');
            }

            // Limpiar campos de entrada
            document.getElementById('studentName').value = '';
            document.getElementById('studentGroup').value = '';
            document.getElementById('studentPartial').value = '';

            // Ocultar todas las pantallas
            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('section1').classList.add('hidden');
            document.getElementById('section2').classList.add('hidden');
            document.getElementById('section3').classList.add('hidden');

            // Mostrar pantalla de inicio
            document.getElementById('startScreen').classList.remove('hidden');

            // Actualizar contadores (incluyendo el número de intento)
            updateStartScreenCounters();

            // Actualizar títulos y textos desde el JSON
            updateUIFromJSON();

            // Parar el cronómetro si está corriendo
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            // Resetear el display del cronómetro
            document.getElementById('timeDisplay').textContent = '00:00';

            // Forzar nueva mezcla para el próximo intento
            console.log('🔄 Preparando nueva mezcla para el próximo intento...');

            // Pre-mezclar las preguntas para el próximo intento
            if (EVALUATION_CONFIG && EVALUATION_CONFIG.section1 && EVALUATION_CONFIG.section1.questions) {
                const tempQuestions = [...EVALUATION_CONFIG.section1.questions];
                // Aplicar múltiples rondas de mezcla
                for (let i = 0; i < 3; i++) {
                    tempQuestions.sort(() => Math.random() - 0.5);
                }
                console.log('🔀 Preguntas pre-mezcladas para próximo intento');
            }

            // Pre-mezclar conceptos y definiciones para el próximo intento
            if (EVALUATION_CONFIG && EVALUATION_CONFIG.section2 && EVALUATION_CONFIG.section2.pairs) {
                const tempConcepts = Object.keys(EVALUATION_CONFIG.section2.pairs);
                const tempDefinitions = Object.values(EVALUATION_CONFIG.section2.pairs);

                // Aplicar múltiples rondas de mezcla con diferentes algoritmos
                for (let i = 0; i < 5; i++) {
                    tempConcepts.sort(() => Math.random() - 0.5);
                    tempDefinitions.sort(() => Math.random() - 0.5);

                    // Mezcla adicional usando timestamp
                    const timestamp = Date.now();
                    tempConcepts.sort(() => Math.sin(timestamp + i) - 0.5);
                    tempDefinitions.sort(() => Math.cos(timestamp + i) - 0.5);
                }
                console.log('🔀 Conceptos y definiciones pre-mezclados para próximo intento');
            }

            // Pre-mezclar palabras del ahorcado para el próximo intento
            if (EVALUATION_CONFIG && EVALUATION_CONFIG.section3 && EVALUATION_CONFIG.section3.words) {
                const tempWords = [...EVALUATION_CONFIG.section3.words];
                for (let i = 0; i < 3; i++) {
                    tempWords.sort(() => Math.random() - 0.5);
                }
                console.log('🔀 Palabras del ahorcado pre-mezcladas para próximo intento');
            }

            showNotification('¡Listo para un nuevo intento! Todo será mezclado nuevamente.', 'success');
        }
